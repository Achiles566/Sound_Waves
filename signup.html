{% extends "base.html" %}

{% block title %}Sign up — SoundWave{% endblock %}

{% block content %}
<div class="form-page">
  <h1>Create your account</h1>
  <p class="subtitle">Start uploading in under a minute.</p>

  <form method="POST" action="{{ url_for('signup') }}">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username }}" required minlength="3" maxlength="50" placeholder="yourname" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" required placeholder="you@example.com" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters" />
    </div>

    <div class="field">
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6" />
    </div>

    <button type="submit" class="btn btn-primary btn-full">Create account</button>
  </form>

  <p class="form-footer">
    Already have an account? <a href="{{ url_for('login') }}">Log in</a>
  </p>
</div>
{% endblock %}
