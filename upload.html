{% extends "base.html" %}

{% block title %}Upload — SoundWave{% endblock %}

{% block content %}
<div class="form-page">
  <h1>Upload a track</h1>
  <p class="subtitle">MP3, WAV, OGG, or M4A. Up to 30MB.</p>

  <form method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required placeholder="Track title" />
    </div>

    <div class="field">
      <label for="artist">Artist</label>
      <input type="text" id="artist" name="artist" required placeholder="Artist name" />
    </div>

    <div class="field">
      <label for="description">Description (optional)</label>
      <textarea id="description" name="description" rows="3" placeholder="What's this track about?"></textarea>
    </div>

    <div class="field">
      <label for="cover_file">Cover image (optional)</label>
      <input type="file" id="cover_file" name="cover_file" accept="image/*" />
      <img id="cover-preview" class="upload-preview" style="display:none" alt="Cover preview" />
    </div>

    <div class="field">
      <label for="audio_file">Audio file</label>
      <input type="file" id="audio_file" name="audio_file" accept="audio/*" required />
    </div>

    <button type="submit" class="btn btn-primary btn-full">Publish track</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Show a quick preview of the cover image before it's uploaded.
  document.getElementById("cover_file").addEventListener("change", function (e) {
    const file = e.target.files[0];
    const preview = document.getElementById("cover-preview");
    if (!file) {
      preview.style.display = "none";
      return;
    }
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  });
</script>
{% endblock %}
