{% extends "base.html" %}

{% block title %}Edit profile — SoundWave{% endblock %}

{% block content %}
<div class="form-page">
  <h1>Edit your profile</h1>
  <p class="subtitle">This is what other people see.</p>

  <form method="POST" action="{{ url_for('edit_profile') }}" enctype="multipart/form-data">
    <div class="field">
      <label for="avatar_file">Profile picture</label>
      <input type="file" id="avatar_file" name="avatar_file" accept="image/*" />
      <img
        id="avatar-preview"
        class="upload-preview upload-preview-round"
        src="{% if profile_row.avatar_path %}{{ url_for('static', filename=profile_row.avatar_path) }}{% endif %}"
        style="display: {{ 'block' if profile_row.avatar_path else 'none' }}"
        alt="Avatar preview"
      />
    </div>

    <div class="field">
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" rows="4" maxlength="500" placeholder="Tell people a bit about yourself">{{ profile_row.bio }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary btn-full">Save changes</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("avatar_file").addEventListener("change", function (e) {
    const file = e.target.files[0];
    const preview = document.getElementById("avatar-preview");
    if (!file) return;
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  });
</script>
{% endblock %}
